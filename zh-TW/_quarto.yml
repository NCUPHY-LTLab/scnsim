website:
  title: SCNSim
  description: 超導電路網路模擬
  page-navigation: true
  announcement:
    content: "R2 開發中，尚未正式發佈。"
    icon: info-circle
    type: warning
    dismissable: false
    position: above-navbar
  search:
    location: navbar
    type: overlay
  reader-mode: false
  repo-url: https://github.com/NCUPHY-LTLab/scnsim
  repo-subdir: zh-TW
  repo-actions:
  - source
  - issue
  navbar:
    left:
    - text: 總覽
      href: index.qmd
    - text: 教學
      href: docs/index.qmd
    - text: 觀念
      href: docs/concepts/index.qmd
    - text: 使用指南
      href: docs/guides/benchmark.qmd
    - text: 貢獻
      href: docs/contribute.qmd
    tools:
    - icon: github
      href: https://github.com/NCUPHY-LTLab/scnsim
      text: GitHub 原始碼
      aria-label: GitHub 原始碼
    tools-collapse: true
