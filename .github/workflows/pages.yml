name: Versioned documentation Pages

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# One serialized combined publication, independent of the product branch head.
concurrency:
  group: scnsim-dual-branch-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up locked documentation tooling
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          python-version: "3.12"

      - name: Snapshot pinned documentation and verify historical catalog sources
        id: sources
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_BRANCH: ${{ github.base_ref }}
          REF_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != pull_request && "$REF_BRANCH" != main && "$REF_BRANCH" != develop ]]; then
            echo "Pages recovery must be dispatched from main or develop" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == pull_request && "$TARGET_BRANCH" != main && "$TARGET_BRANCH" != develop ]]; then
            echo "Pages PR target must be main or develop" >&2
            exit 1
          fi
          python_bin=$(uv python find 3.12)
          authority="$GITHUB_WORKSPACE"
          publication_sha=$(git rev-parse HEAD)
          docs_source_sha=$("$python_bin" -I "$authority/scripts/pages_site.py" source --pointer "$authority/scripts/pages_source.json")
          [[ "$publication_sha" =~ ^[0-9a-f]{40}$ && "$docs_source_sha" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$docs_source_sha"
          actual=$(git rev-parse 'FETCH_HEAD^{commit}')
          if [[ "$actual" != "$docs_source_sha" ]]; then
            echo "Pinned documentation commit is unavailable" >&2
            exit 1
          fi
          staging="$RUNNER_TEMP/scnsim-pages"
          mkdir -p "$staging/sources" "$staging/theme"
          # The publisher vendors the exact released Askr theme independently
          # of the unchanged documentation-content commit.
          git archive "$publication_sha" _extensions/arfiligol/askr | tar -xf - -C "$staging/theme"
          plan=$("$python_bin" -I "$authority/scripts/pages_site.py" plan --catalog "$authority/scripts/pages_versions.json")
          docs_source_dir=""
          while IFS='|' read -r kind label slug tag commit; do
            source="$staging/sources/$slug"
            mkdir -p "$source"
            if [[ "$kind" == development ]]; then
              git archive "$docs_source_sha" | tar -xf - -C "$source"
              docs_source_dir="$source"
            elif [[ "$kind" == pinned-development ]]; then
              git fetch --no-tags --depth=1 origin "$commit"
              actual=$(git rev-parse 'FETCH_HEAD^{commit}')
              if [[ "$actual" != "$commit" ]]; then
                echo "Pinned historical documentation commit is unavailable" >&2
                exit 1
              fi
              git archive "$commit" | tar -xf - -C "$source"
            else
              git fetch --no-tags --depth=1 origin "refs/tags/$tag"
              actual=$(git rev-parse 'FETCH_HEAD^{commit}')
              if [[ "$actual" != "$commit" ]]; then
                echo "Pages tag $tag no longer matches its pinned commit" >&2
                exit 1
              fi
              git archive "$commit" | tar -xf - -C "$source"
            fi
          done <<< "$plan"
          [[ -n "$docs_source_dir" && -f "$docs_source_dir/uv.lock" ]]
          {
            echo "docs_source_sha=$docs_source_sha"
            echo "docs_source_dir=$docs_source_dir"
            echo "publication_sha=$publication_sha"
          } >> "$GITHUB_OUTPUT"
          echo "docs=$docs_source_sha; publisher=$publication_sha; historical catalog identities verified"

      - name: Set up Quarto 1.10.18
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: "1.10.18"

      - name: Prepare one isolated documentation environment
        env:
          DOCS_SOURCE_DIR: ${{ steps.sources.outputs.docs_source_dir }}
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME
          cd "$DOCS_SOURCE_DIR"
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/scnsim-pages/docs-env" \
            uv sync --locked --only-group course-generation --no-install-project --no-build
          "$RUNNER_TEMP/scnsim-pages/docs-env/bin/python" -I -c \
            'import importlib.util; names=("scnsim", "jax", "julia", "juliacall"); found=[name for name in names if importlib.util.find_spec(name) is not None]; assert not found, found'

      - name: Render both exact documentation versions without execution
        env:
          DOCS_SOURCE_SHA: ${{ steps.sources.outputs.docs_source_sha }}
          PUBLICATION_SHA: ${{ steps.sources.outputs.publication_sha }}
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME
          staging="$RUNNER_TEMP/scnsim-pages"
          authority="$GITHUB_WORKSPACE"
          export PATH="$staging/docs-env/bin:$PATH"
          python_bin="$staging/docs-env/bin/python"
          plan=$("$python_bin" -I "$authority/scripts/pages_site.py" plan --catalog "$authority/scripts/pages_versions.json")
          while IFS='|' read -r kind label slug tag commit; do
            source="$staging/sources/$slug"
            if [[ "$kind" == development ]]; then source_sha=$DOCS_SOURCE_SHA; else source_sha=$commit; fi
            "$python_bin" -I "$authority/scripts/pages_site.py" prepare \
              --catalog "$authority/scripts/pages_versions.json" \
              --vendor "$staging/theme/_extensions/arfiligol/askr" \
              --source "$source" --label "$label" \
              --source-sha "$source_sha" --publication-sha "$PUBLICATION_SHA"
            (
              cd "$source"
              quarto render --profile pages --no-execute
            )
          done <<< "$plan"

      - name: Validate and atomically assemble one Pages tree
        env:
          DOCS_SOURCE_SHA: ${{ steps.sources.outputs.docs_source_sha }}
          PUBLICATION_SHA: ${{ steps.sources.outputs.publication_sha }}
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/scnsim-pages"
          authority="$GITHUB_WORKSPACE"
          "$staging/docs-env/bin/python" -I "$authority/scripts/pages_site.py" assemble \
            --catalog "$authority/scripts/pages_versions.json" \
            --template "$authority/scripts/pages_root_template.html" \
            --sources "$staging/sources" --docs-source-sha "$DOCS_SOURCE_SHA" \
            --publication-sha "$PUBLICATION_SHA" --output "$staging/site"

      - name: Upload one Pages artifact after successful validation
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/scnsim-pages/site

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Deploy the validated combined artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
